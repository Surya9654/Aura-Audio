<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aura Remote">
  <title>Aura 3.0 — Wi-Fi Mobile Remote</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/remote.css">
</head>
<body>
  <!-- Dynamic Ambient Glow Backdrop -->
  <div class="ambient-glow" id="ambient-glow"></div>
  <div class="ambient-scrim"></div>

  <!-- Reconnect Banner (shown when connection drops) -->
  <div class="connection-toast" id="connection-toast">
    <span class="toast-dot connecting"></span>
    <span id="toast-text">Connecting to Aura Desktop...</span>
  </div>

  <main class="mobile-container">
    <!-- Header / Telemetry -->
    <header class="mobile-header">
      <div class="header-status">
        <span class="status-indicator live" id="status-dot"></span>
        <span class="status-text" id="status-text">WI-FI LINK ACTIVE</span>
      </div>
      <div class="header-badges">
        <span class="badge badge-gold" id="badge-format">FLAC 24-BIT</span>
        <span class="badge" id="badge-dr">DR 14 dB</span>
      </div>
    </header>

    <!-- Album Art Card with Dynamic Lighting -->
    <section class="artwork-section">
      <div class="artwork-card" id="artwork-card">
        <img id="album-cover" src="/api/artwork" alt="Album Cover">
        <div class="artwork-overlay-ring"></div>
      </div>
    </section>

    <!-- Track Metadata & Spec -->
    <section class="metadata-section">
      <div class="title-container">
        <h1 class="track-title" id="track-title">Aura Lossless Studio</h1>
      </div>
      <p class="track-artist" id="track-artist">Ready for Playback</p>
      <p class="track-album" id="track-album">Aura 3.0 Audiophile Master</p>
    </section>

    <!-- Scrubber Progress Bar -->
    <section class="scrubber-section">
      <div class="scrubber-track" id="scrubber-track">
        <div class="scrubber-fill" id="scrubber-fill"></div>
        <input type="range" class="scrubber-input" id="scrubber-input" min="0" max="100" step="0.1" value="0">
      </div>
      <div class="time-row">
        <span class="time-label" id="current-time">0:00</span>
        <span class="time-label" id="remaining-time">-0:00</span>
      </div>
    </section>

    <!-- Primary Media Controls -->
    <section class="controls-section">
      <button class="btn-ctrl btn-secondary" id="btn-prev" aria-label="Previous Track">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19 20 9 12 19 4 19 20"></polygon>
          <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"></line>
        </svg>
      </button>

      <button class="btn-ctrl btn-play-master" id="btn-play-pause" aria-label="Play or Pause">
        <svg width="26" height="26" id="play-icon" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 4 20 12 6 20 6 4"></polygon>
        </svg>
      </button>

      <button class="btn-ctrl btn-secondary" id="btn-next" aria-label="Next Track">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"></line>
        </svg>
      </button>
    </section>

    <!-- Volume Slider Section -->
    <section class="volume-section">
      <button class="btn-vol" id="btn-mute" aria-label="Mute / Unmute">
        <svg width="20" height="20" id="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </button>
      <div class="volume-slider-wrapper">
        <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" step="1" value="85">
      </div>
      <span class="volume-val" id="volume-val">85%</span>
    </section>

    <!-- Audiophile Soundfield & Acoustic Target Pill Sheet -->
    <section class="audiophile-sheet">
      <div class="sheet-title">STUDIO ARCHITECTURE &amp; TARGETS</div>
      
      <!-- True Stereo Mode Selector -->
      <div class="sheet-card">
        <div class="sheet-row">
          <span class="sheet-label">Stereo Mode</span>
          <div class="segmented-control" id="stereo-mode-selector">
            <button class="segment-btn active" data-mode="true-stereo" id="seg-true-stereo">True Stereo</button>
            <button class="segment-btn" data-mode="crossfeed" id="seg-crossfeed">Crossfeed</button>
            <button class="segment-btn" data-mode="mono" id="seg-mono">Mono</button>
          </div>
        </div>
      </div>

      <!-- Acoustic Target Preset -->
      <div class="sheet-card">
        <div class="sheet-row">
          <span class="sheet-label">Acoustic Target</span>
          <select class="sheet-select" id="preset-selector">
            <option value="reference">Audiophile Reference (Flat)</option>
            <option value="airpods-max">Apple AirPods Max</option>
            <option value="sony-xm5">Sony WH-1000XM5 / XM4</option>
            <option value="hd650">Sennheiser HD 600 / HD 650</option>
            <option value="hd560s">Sennheiser HD 560S</option>
            <option value="m50x">Audio-Technica ATH-M50x</option>
            <option value="moondrop">Moondrop IEM Target</option>
            <option value="kz-iem">KZ / Chi-Fi Balanced Armature</option>
            <option value="warm-tube">Warm Tube &amp; Vinyl</option>
          </select>
        </div>
      </div>
    </section>
  </main>

  <script src="/remote.js"></script>
</body>
</html>
